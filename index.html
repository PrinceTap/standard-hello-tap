
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>HelloTap | Digital Business Card</title>

  <!-- Social media icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

  <style>
    /* ========================================
       HELLOTAP CUSTOMIZATION
       Edit the colors and sizes here
    ======================================== */
    :root {
      --background: #ffffff;
      --text: #171717;
      --muted: #656565;
      --button: #202024;
      --card: #f7f6f8;
      --accent: #3897f0;
      --radius: 50px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
     font-family: Arial, Helvetica, sans-serif;
     background: #ffffff;
     color: var(--text);
     min-height: 100vh;
     margin: 0;
     padding: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .phone-page {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 0;
      overflow: hidden;
      min-height: 100vh;
      box-shadow: none;
   }

    /* Cover image */
    .cover {
      width: 100%;
      height: 190px;
      background: #eeeeee;
      position: relative;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .cover.hidden {
      display: none;
    }

    /* Main profile section */
    .profile {
      text-align: center;
      padding: 0 22px 24px;
    }

    .profile-photo-wrap {
      width: 160px;
      height: 160px;
      margin: -78px auto 22px;
      position: relative;
      z-index: 2;
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 6px solid white;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.16);
      background: #eee;
      display: block;
    }

    .profile-photo-wrap.no-cover {
      margin-top: 24px;
    }

    .name-line {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 20px;
    }

    .name {
      font-size: 28px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .verified {
      color: var(--accent);
      font-size: 21px;
    }

    .profession {
      font-size: 18px;
      line-height: 1.5;
      color: #444;
      margin-bottom: 3px;
    }

    .intro {
      font-size: 16px;
      line-height: 1.6;
      color: var(--muted);
      white-space: pre-line;
      overflow-wrap: anywhere;
      margin-top: 4px;
    }

    /* Call, message, email */
    .contact-actions {
      display: flex;
      justify-content: center;
      gap: 36px;
      margin: 26px 0 24px;
    }

    .contact-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      color: white;
      background: var(--button);
      font-size: 24px;
      transition: transform 0.2s, opacity 0.2s;
    }

    .contact-action:hover,
    .save-button:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }

    /* Save contact */
    .save-row {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 29px;
    }

    .save-button {
      flex: 1;
      min-width: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      min-height: 62px;
      padding: 14px 10px;
      border: 0;
      border-radius: 13px;
      background: var(--button);
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .share-button {
      flex: 0 0 62px;
      border: 0;
      border-radius: 13px;
      background: var(--button);
      color: white;
      font-size: 21px;
      cursor: pointer;
    }

    /* Social media section */
    .links-section {
      padding: 0 18px 25px;
    }

    .links-heading {
      display: inline-block;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      padding: 8px 12px;
      border-radius: 9px;
      background: #faf9fb;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .social-link {
      display: flex;
      align-items: center;
      gap: 17px;
      min-height: 83px;
      padding: 15px 18px;
      background: var(--card);
      border-radius: var(--radius);
      transition: background 0.2s, transform 0.2s;
    }

    .social-link:hover {
      background: #eeedf0;
      transform: translateX(2px);
    }

    .social-icon {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 31px;
    }

    .social-label {
      flex: 1;
      font-size: 17px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .link-arrow {
      font-size: 22px;
      color: #171717;
    }

    /* Social icon colors */
    .instagram { color: #d94686; }
    .facebook { color: #1877f2; }
    .tiktok { color: #111111; }
    .youtube { color: #ff0000; }
    .linkedin { color: #0a66c2; }
    .viber { color: #7360f2; }
    .whatsapp { color: #25d366; }
    .discord { color: #5865f2; }
    .telegram { color: #229ed9; }
    .website { color: #333333; }

    .footer {
      text-align: center;
      padding: 20px 10px 25px;
      color: #999;
      font-size: 12px;
    }

    .footer strong {
      color: #555;
    }

    /* Hide optional elements */
    .hidden {
      display: none !important;
    }

    
/* Responsive layout for mobile, tablet, and desktop */

@media (max-width: 480px) {
  .cover {
    height: 185px;
  }

  .profile {
    padding-left: 18px;
    padding-right: 18px;
  }

  .profile-photo-wrap {
    width: 150px;
    height: 150px;
    margin-top: -75px;
  }

  .name {
    font-size: 26px;
  }

  .contact-actions {
    gap: 32px;
  }

  .links-section {
    padding-left: 14px;
    padding-right: 14px;
  }

  .social-link {
    min-height: 76px;
  }
}

/* Wider screens */
@media (min-width: 768px) {
  .phone-page {
    max-width: 760px;
  }

  .cover {
    height: 260px;
  }

  .profile {
    padding-left: 40px;
    padding-right: 40px;
  }

  .links-section {
    padding-left: 40px;
    padding-right: 40px;
  }
}

/* Large desktop screens */
@media (min-width: 1100px) {
  .phone-page {
    max-width: 850px;
  }

  .cover {
    height: 300px;
  }
}
  </style>
</head>

<body>

  <main class="phone-page">

    <!-- =====================================
         COVER PHOTO
         Change cover.jpg to your customer's
         cover image path or image URL.
    ====================================== -->
    <div class="cover" id="coverPhoto"></div>

    <!-- PROFILE -->
    <section class="profile">

      <div class="profile-photo-wrap" id="profilePhotoWrap">
        <!-- Replace profile.jpg with the customer's photo -->
        <img
          class="profile-photo"
          id="profilePhoto"
          src="profile.jpg"
          alt="Profile photo"
        />
      </div>

      <div class="name-line">
        <h1 class="name" id="customerName">Jo Latoja</h1>

        <!-- Set showVerified to false to remove the badge -->
        <i
          class="fa-solid fa-circle-check verified"
          id="verifiedBadge"
          aria-label="Verified"
        ></i>
      </div>

      <p class="profession" id="profession">
        Lifestyle Explorer • Creator
      </p>

      <p class="intro" id="introduction">
        Let's create something amazing together!
      </p>

      <!-- CONTACT BUTTONS -->
      <div class="contact-actions">

        <a
          class="contact-action"
          id="callButton"
          href="tel:+639123456789"
          aria-label="Call"
          title="Call"
        >
          <i class="fa-solid fa-phone"></i>
        </a>

        <a
          class="contact-action"
          id="messageButton"
          href="sms:+639123456789"
          aria-label="Message"
          title="Message"
        >
          <i class="fa-solid fa-comment-dots"></i>
        </a>

        <a
          class="contact-action"
          id="emailButton"
          href="mailto:hello@example.com"
          aria-label="Email"
          title="Email"
        >
          <i class="fa-solid fa-envelope"></i>
        </a>

      </div>

      <!-- SAVE CONTACT AND SHARE -->
      <div class="save-row">

        <button class="save-button" id="saveContactButton">
          <i class="fa-solid fa-address-card"></i>
          <span>Save to Contacts</span>
        </button>

        <button
          class="share-button"
          id="shareButton"
          aria-label="Share profile"
          title="Share profile"
        >
          <i class="fa-solid fa-share-nodes"></i>
        </button>

      </div>

    </section>

    <!-- SOCIAL LINKS -->
    <section class="links-section">

      <h2 class="links-heading">Links</h2>

      <div class="links-list" id="socialLinks">

        <!--
          To add a social link:
          1. Copy one social-link block.
          2. Change its href to the customer's URL.
          3. Change the icon, color class and label.
          4. Delete any social-link block you don't need.
        -->

        <a
          class="social-link"
          href="https://instagram.com/yourusername"
          target="_blank"
          rel="noopener noreferrer"
          data-social="instagram"
        >
          <span class="social-icon instagram">
            <i class="fa-brands fa-instagram"></i>
          </span>
          <span class="social-label">Instagram</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a
          class="social-link"
          href="https://facebook.com/yourusername"
          target="_blank"
          rel="noopener noreferrer"
          data-social="facebook"
        >
          <span class="social-icon facebook">
            <i class="fa-brands fa-facebook"></i>
          </span>
          <span class="social-label">Facebook</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a
          class="social-link"
          href="https://tiktok.com/@yourusername"
          target="_blank"
          rel="noopener noreferrer"
          data-social="tiktok"
        >
          <span class="social-icon tiktok">
            <i class="fa-brands fa-tiktok"></i>
          </span>
          <span class="social-label">TikTok</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a
          class="social-link"
          href="https://youtube.com/@yourusername"
          target="_blank"
          rel="noopener noreferrer"
          data-social="youtube"
        >
          <span class="social-icon youtube">
            <i class="fa-brands fa-youtube"></i>
          </span>
          <span class="social-label">YouTube</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a
          class="social-link"
          href="https://linkedin.com/in/yourusername"
          target="_blank"
          rel="noopener noreferrer"
          data-social="linkedin"
        >
          <span class="social-icon linkedin">
            <i class="fa-brands fa-linkedin"></i>
          </span>
          <span class="social-label">LinkedIn</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a
          class="social-link"
          href="viber://chat?number=%2B639123456789"
          data-social="viber"
        >
          <span class="social-icon viber">
            <i class="fa-brands fa-viber"></i>
          </span>
          <span class="social-label">Viber</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a
          class="social-link"
          href="https://wa.me/639123456789"
          target="_blank"
          rel="noopener noreferrer"
          data-social="whatsapp"
        >
          <span class="social-icon whatsapp">
            <i class="fa-brands fa-whatsapp"></i>
          </span>
          <span class="social-label">WhatsApp</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a
          class="social-link"
          href="https://discord.com/users/YOUR_USER_ID"
          target="_blank"
          rel="noopener noreferrer"
          data-social="discord"
        >
          <span class="social-icon discord">
            <i class="fa-brands fa-discord"></i>
          </span>
          <span class="social-label">Discord</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a
          class="social-link"
          href="https://t.me/yourusername"
          target="_blank"
          rel="noopener noreferrer"
          data-social="telegram"
        >
          <span class="social-icon telegram">
            <i class="fa-brands fa-telegram"></i>
          </span>
          <span class="social-label">Telegram</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a
          class="social-link"
          href="https://yourwebsite.com"
          target="_blank"
          rel="noopener noreferrer"
          data-social="website"
        >
          <span class="social-icon website">
            <i class="fa-solid fa-globe"></i>
          </span>
          <span class="social-label">Website</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

      </div>

    </section>

    <footer class="footer">
      Powered by <strong>HelloTap</strong>
    </footer>

  </main>

  <script>
    /* ========================================
       CUSTOMER INFORMATION
       Edit this section for each customer.
    ======================================== */

    const customer = {
      name: "HelloTap",
      profession: "Tap.Connect.Grow",
      introduction: "NFC Business Card + Personalized Digital Profile",

      phone: "+639123456789",
      email: "hello@example.com",

      // Optional WhatsApp number, country code included.
      // Use digits only, without the plus sign.
      whatsapp: "639123456789",

      // Optional photos.
      // Use "" to hide the cover or profile image.
      cover: "cover.jpg",
      photo: "Prince1.jpg",

      showVerified: true,

      // Contact details included in the VCF file.
      company: "",
      address: "",
      website: "https://yourwebsite.com"
    };

    /* Apply customer information */

    document.getElementById("customerName").textContent =
      customer.name;

    document.getElementById("profession").textContent =
      customer.profession;

    document.getElementById("introduction").textContent =
      customer.introduction;

    document.getElementById("verifiedBadge").classList.toggle(
      "hidden",
      !customer.showVerified
    );

    const cover = document.getElementById("coverPhoto");
    const profileWrap = document.getElementById("profilePhotoWrap");
    const profilePhoto = document.getElementById("profilePhoto");

    if (customer.cover.trim()) {
      cover.style.backgroundImage =
        `url("${customer.cover.replace(/["\\]/g, "")}")`;
    } else {
      cover.classList.add("hidden");
      profileWrap.classList.add("no-cover");
    }

    if (customer.photo.trim()) {
      profilePhoto.src = customer.photo;
    } else {
      profilePhoto.classList.add("hidden");
    }

    // Contact buttons
    document.getElementById("callButton").href =
      customer.phone ? `tel:${customer.phone}` : "#";

    document.getElementById("messageButton").href =
      customer.phone ? `sms:${customer.phone}` : "#";

    document.getElementById("emailButton").href =
      customer.email
        ? `mailto:${customer.email}`
        : "#";

    // Update WhatsApp links from the customer settings
    document.querySelector('[data-social="whatsapp"]').href =
      customer.whatsapp
        ? `https://wa.me/${customer.whatsapp.replace(/\D/g, "")}`
        : "#";

    document.querySelector('[data-social="website"]').href =
      customer.website || "#";

    /* ========================================
       SAVE TO CONTACTS
       Creates a downloadable VCF contact file.
    ======================================== */

    document.getElementById("saveContactButton")
      .addEventListener("click", function () {

        const escapeVCard = (value) => String(value || "")
          .replace(/\\/g, "\\\\")
          .replace(/\n/g, "\\n")
          .replace(/,/g, "\\,")
          .replace(/;/g, "\\;");

        const lines = [
          "BEGIN:VCARD",
          "VERSION:3.0",
          `FN:${escapeVCard(customer.name)}`,
          `TITLE:${escapeVCard(customer.profession)}`
        ];

        if (customer.phone) {
          lines.push(`TEL;TYPE=CELL:${customer.phone}`);
        }

        if (customer.email) {
          lines.push(`EMAIL;TYPE=INTERNET:${customer.email}`);
        }

        if (customer.company) {
          lines.push(`ORG:${escapeVCard(customer.company)}`);
        }

        if (customer.address) {
          lines.push(`ADR;TYPE=WORK:;;${escapeVCard(customer.address)};;;;`);
        }

        if (customer.website) {
          lines.push(`URL:${customer.website}`);
        }

        lines.push("END:VCARD");

        const vcard = lines.join("\r\n") + "\r\n";

        const blob = new Blob(
          [vcard],
          { type: "text/vcard;charset=utf-8" }
        );

        const url = URL.createObjectURL(blob);
        const download = document.createElement("a");

        download.href = url;
        download.download =
          (customer.name || "contact")
            .replace(/[^\w-]+/g, "_") + ".vcf";

        document.body.appendChild(download);
        download.click();
        download.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });

    /* ========================================
       SHARE PROFILE
       Uses the phone's native sharing menu
       when available.
    ======================================== */

    document.getElementById("shareButton")
      .addEventListener("click", async function () {

        const shareData = {
          title: customer.name,
          text: `${customer.name} | ${customer.profession}`,
          url: window.location.href
        };

        try {
          if (navigator.share) {
            await navigator.share(shareData);
          } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(window.location.href);
            alert("Profile link copied!");
          } else {
            prompt("Copy your profile link:", window.location.href);
          }
        } catch (error) {
          if (error.name !== "AbortError") {
            alert("Unable to share this profile right now.");
          }
        }
      });

    /* ========================================
       OPTIONAL SOCIAL LINKS
       Add a link to this list to display it.
       Leave url empty or remove the entry
       to hide the link automatically.
    ======================================== */

    const optionalSocialLinks = [
      // Example:
      // { id: "instagram", url: "https://instagram.com/name" },
      // { id: "facebook", url: "https://facebook.com/name" }
    ];

    optionalSocialLinks.forEach(item => {
      const element = document.querySelector(
        `[data-social="${item.id}"]`
      );

      if (!element) return;

      if (!item.url || !item.url.trim()) {
        element.remove();
      } else {
        element.href = item.url.trim();
      }
    });

    // Hide only links that have no URL.
document.querySelectorAll("[data-social]").forEach(link => {
  const href = link.getAttribute("href") || "";

  if (!href.trim() || href.trim() === "#") {
    link.remove();
  }
});
  </script>

</body>
</html>
